model_list:
  # ==========================================================================
  # EMBER CONTRACT ALIASES  —  gpu/<task>/<role>
  # ==========================================================================
  # THE CONSUMER-FACING SURFACE OF THIS STACK. Consumers (ember-ai and any
  # other client) address ONLY these names. Everything below this block is
  # this box's internal topology and may be renamed, re-pointed, or removed
  # freely; these six names may not.
  #
  # The contract is a set of ROLES, and each box fills each role with whatever
  # weights it can actually run. A 96 GB box puts Qwen3.6-35B behind
  # gpu/chat/interactive; a 32 GB box puts Qwen3-30B-A3B there. The consumer's
  # config does not change, which is the entire point: consumers select a
  # capability tier, deployments select the weights.
  #
  # Role-named env vars are correct HERE and wrong on the consumer side. This
  # is the layer that decides "role X is served by model Y at backend Z", so
  # the role belongs in the variable name. A consumer's variables name SERVERS
  # (GPU_<SERVER>_URL), never tasks — it addresses infrastructure, not roles.
  #
  # ┌──────────────────────────────┬──────────────────────────────────────────┐
  # │ alias                        │ what a box promises by publishing it     │
  # ├──────────────────────────────┼──────────────────────────────────────────┤
  # │ gpu/chat/interactive         │ tool-calling, >=32k ctx, JSON            │
  # │                              │ response_format, latency-tuned           │
  # │ gpu/chat/bulk                │ tool-calling, >=32k ctx, JSON            │
  # │                              │ response_format, throughput-tuned        │
  # │ gpu/chat/fast                │ tool-calling, >=16k ctx, low latency     │
  # │ gpu/chat/vision              │ image input (OPTIONAL)                   │
  # │ gpu/embed/bge-m3             │ BAAI/bge-m3 exactly, 1024-dim            │
  # │ gpu/rerank/bge-reranker-v2-m3│ BAAI/bge-reranker-v2-m3 cross-encoder    │
  # └──────────────────────────────┴──────────────────────────────────────────┘
  #
  # The two embed/rerank rows name a MODEL, not a role, deliberately. A vector
  # index is built with one specific embedder and cannot be re-pointed at a
  # different one without re-embedding the corpus — and a same-dimension
  # substitute does NOT error, it silently returns wrong neighbours. Those two
  # are a data contract; the chat rows are a capability contract.
  #
  # `interactive` and `bulk` MAY point at the same deployment (the default
  # below does). They are separate names so a consumer can place them on
  # different servers — interactive chat on a big shared box, bulk extraction
  # on a local one — without either side editing YAML.
  #
  # Fill the roles from .env; see .env.example's "EMBER CONTRACT" section.

  - model_name: gpu/chat/interactive
    litellm_params:
      model: os.environ/CONTRACT_INTERACTIVE_MODEL
      api_base: os.environ/CONTRACT_INTERACTIVE_API_BASE
      # From env, NOT a literal "EMPTY". A role served by a LOCAL engine needs
      # no key and compose defaults this to EMPTY; a role DELEGATED to a peer
      # stack needs that peer's key, and hardcoding EMPTY made cross-server
      # delegation impossible — the peer's LiteLLM 401s.
      api_key: os.environ/CONTRACT_INTERACTIVE_API_KEY
      timeout: 120
      max_parallel_requests: 8
      # Hybrid-thinking models: thinking OFF here too, for the same reasons as
      # bulk/fast/vision. This role promises "JSON response_format, latency-
      # tuned", and thinking-on breaks both. Measured on ddai4 2026-09-12
      # against Qwen3.6-35B-A3B (n=20, identical extraction prompt):
      #   json_schema  p50 8.65s vs bulk's 0.52s; 1537 output tokens of which
      #                1466 are reasoning, vs 70 and 0.
      #   json_object  8 of 20 responses were UNPARSEABLE — the reasoning->
      #                content handoff emits a corrupt prefix
      #                (`{": {": {"orgs": [...`) because the JSON grammar binds
      #                from the first content token while the reasoning span is
      #                unconstrained (enable_in_reasoning=False).
      #   content:null with finish_reason:length at modest max_tokens, because
      #                the budget is spent reasoning before any content — which
      #                ember's sync path turns into a silently EMPTY extraction
      #                recorded as a success.
      # Recall was identical (1.00) with and without reasoning, so nothing was
      # bought for that cost. Spec: docs/superpowers/specs/2026-09-12-
      # interactive-role-thinking-mode.md.
      #
      # A consumer that genuinely wants reasoning on a given call sends
      # extra_body {"chat_template_kwargs": {"enable_thinking": true}}, which
      # wins by the router's merge order. Inert on a non-thinking model.
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      mode: chat
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_vision: false

  - model_name: gpu/chat/bulk
    litellm_params:
      model: os.environ/CONTRACT_BULK_MODEL
      api_base: os.environ/CONTRACT_BULK_API_BASE
      # From env, NOT a literal "EMPTY". A role served by a LOCAL engine needs
      # no key and compose defaults this to EMPTY; a role DELEGATED to a peer
      # stack needs that peer's key, and hardcoding EMPTY made cross-server
      # delegation impossible — the peer's LiteLLM 401s.
      api_key: os.environ/CONTRACT_BULK_API_KEY
      timeout: 600
      # 8, measured on ddai3 2026-10-10 (Qwen3.6-35B-A3B, RTX PRO 4500 32 GB,
      # beside live ingest), 12 concurrent ~6k-token bulk requests for 180 s:
      #   cap 4: 12.0 req/min, p50 83 s (queueing here), interactive p95 0.30 s
      #   cap 8: 36.7 req/min, p50 15 s,                interactive p95 0.56 s
      #   (20 requests at cap 8: 65/min, interactive p95 0.77 s, max 1.1 s)
      # Health probe passed every sample, zero preemptions throughout. Not
      # higher: graph extraction sends up to ~26k-token prompts, and 8 of
      # those is ~100% of the 204k-token KV pool measured on ddai4 — beyond
      # that the engine queues or preempts instead. Under live extraction this
      # role is ALWAYS full (23 requests per document), so latency-sensitive
      # callers belong on interactive/fast, not here.
      # Spec: project-deepdarshak/.claude/specs/completed/2026-10-10-gpu-watchdog-recovers-a-starved-vllm.md (REQ-WD-03)
      max_parallel_requests: 8
      # Hybrid-thinking models: keep thinking OFF for this role.
      #
      # Spec 0035 puts thinking-mode config on this alias layer, and the two
      # throughput/latency roles are where it has to be off. A consumer drives
      # them with response_format (JSON), and vLLM applies the JSON grammar
      # from the FIRST token — including the span where the model wants to emit
      # its <think> block. The grammar forbids <think> but permits unbounded
      # whitespace, so the model emits "{" and then thousands of blank lines
      # until max_tokens: observed live as ~17,000 lines of whitespace and
      # "Expecting property name enclosed in double quotes", which a consumer
      # sees as an intermittent structured-output parse failure and burns a
      # full generation plus a retry on.
      #
      # A per-call extra_body from the consumer still wins over this by the
      # router's merge order, and on a non-thinking model the kwarg is inert
      # (an unknown chat-template variable is ignored by the template).
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      mode: chat
      supports_function_calling: true
      supports_parallel_function_calling: true
      supports_vision: false

  - model_name: gpu/chat/fast
    litellm_params:
      model: os.environ/CONTRACT_FAST_MODEL
      api_base: os.environ/CONTRACT_FAST_API_BASE
      # From env, NOT a literal "EMPTY". A role served by a LOCAL engine needs
      # no key and compose defaults this to EMPTY; a role DELEGATED to a peer
      # stack needs that peer's key, and hardcoding EMPTY made cross-server
      # delegation impossible — the peer's LiteLLM 401s.
      api_key: os.environ/CONTRACT_FAST_API_KEY
      # Deliberately shorter than the 600s above: this role exists for
      # latency-sensitive calls, so a slow response is a failure, not a wait.
      timeout: 60
      # Hybrid-thinking models: keep thinking OFF for this role.
      #
      # Spec 0035 puts thinking-mode config on this alias layer, and the two
      # throughput/latency roles are where it has to be off. A consumer drives
      # them with response_format (JSON), and vLLM applies the JSON grammar
      # from the FIRST token — including the span where the model wants to emit
      # its <think> block. The grammar forbids <think> but permits unbounded
      # whitespace, so the model emits "{" and then thousands of blank lines
      # until max_tokens: observed live as ~17,000 lines of whitespace and
      # "Expecting property name enclosed in double quotes", which a consumer
      # sees as an intermittent structured-output parse failure and burns a
      # full generation plus a retry on.
      #
      # A per-call extra_body from the consumer still wins over this by the
      # router's merge order, and on a non-thinking model the kwarg is inert
      # (an unknown chat-template variable is ignored by the template).
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  # OPTIONAL. Publish only if this box actually serves a vision-capable model.
  # A consumer that cannot find this alias routes vision to a cloud provider
  # instead, so leaving it unserved degrades cleanly. Backed by Ollama by
  # default rather than vLLM: the VL model is a secondary, low-volume model and
  # Ollama can swap it in and out without taking VRAM from the chat model.
  #
  # THE NAME IS ENV-DRIVEN, and that is the whole point.
  #
  # LiteLLM publishes every alias in this file whether or not its api_base
  # answers, so a box that merely sets ENABLE_OLLAMA=false still lists
  # gpu/chat/vision in /v1/models — and every call then 500s with "Cannot
  # connect to host ollama:11434". That is strictly WORSE than an absent
  # alias: a consumer routes AROUND a missing optional role, but breaks on a
  # published-but-dead one, having no way to tell "unserved" from "serving
  # badly".
  #
  # Deleting the block is not an option either — the default profiles serve
  # vision via Ollama and the Blackwell profile serves it via llama.cpp, so it
  # must stay for them.
  #
  # So a box that cannot serve vision sets
  #   CONTRACT_VISION_ALIAS=unserved/vision
  # which publishes the deployment under a name outside the gpu/ contract
  # namespace. Consumers looking for gpu/chat/vision do not find it and fall
  # back cleanly, while the entry remains introspectable for debugging.
  # Defaults to the real contract name, so every existing box is unaffected.
  - model_name: os.environ/CONTRACT_VISION_ALIAS
    litellm_params:
      model: os.environ/CONTRACT_VISION_MODEL
      api_base: os.environ/CONTRACT_VISION_API_BASE
      # See the chat roles: EMPTY locally, the peer's key when delegated.
      api_key: os.environ/CONTRACT_VISION_API_KEY
      timeout: 300
      # Vision calls are expensive and a blind retry doubles the cost of a
      # genuinely bad image. Per-deployment override of router num_retries.
      num_retries: 0
      # Thinking OFF, for the same reason as bulk and fast — plus one specific
      # to this role. Measured on ddai4 2026-09-12 against Qwen3.6-35B-A3B: a
      # hybrid-thinking model spends the token budget reasoning BEFORE it emits
      # any content, so at max_tokens 16 and 64 the reply was content:null with
      # finish_reason:length, and only at 1024 did it answer — after 148
      # reasoning tokens to say "OK". A consumer sending an image with a modest
      # max_tokens gets an empty answer rather than an error.
      #
      # Vision is where that bites hardest: the role exists for describing and
      # extracting from images, which is not reasoning-limited work, and image
      # tokens already consume the budget this model would rather spend
      # thinking. Inert on a non-thinking model — an unknown chat-template
      # variable is ignored by the template.
      chat_template_kwargs:
        enable_thinking: false
    model_info:
      mode: chat
      supports_vision: true

  # Alias is env-driven, exactly like CONTRACT_VISION_ALIAS: a box with no
  # embedder sets CONTRACT_EMBED_ALIAS=unserved/embed so the deployment is
  # published OUTSIDE the gpu/ namespace. Consumers looking for gpu/embed/bge-m3
  # then do not find it and fall back, instead of finding an alias that
  # fails on every call — the 'published but broken' trap this contract
  # exists to avoid. Defaults to the real name, so a box that serves it
  # is unaffected.
  - model_name: os.environ/CONTRACT_EMBED_ALIAS
    litellm_params:
      model: infinity/BAAI/bge-m3
      api_base: os.environ/CONTRACT_EMBED_API_BASE
      api_key: "EMPTY"
      timeout: 600   # batch embedding of a large document set takes minutes
    model_info:
      mode: embedding

  # Alias is env-driven, exactly like CONTRACT_VISION_ALIAS: a box with no
  # embedder sets CONTRACT_RERANK_ALIAS=unserved/rerank so the deployment is
  # published OUTSIDE the gpu/ namespace. Consumers looking for gpu/rerank/bge-reranker-v2-m3
  # then do not find it and fall back, instead of finding an alias that
  # fails on every call — the 'published but broken' trap this contract
  # exists to avoid. Defaults to the real name, so a box that serves it
  # is unaffected.
  - model_name: os.environ/CONTRACT_RERANK_ALIAS
    litellm_params:
      model: infinity/BAAI/bge-reranker-v2-m3
      api_base: os.environ/CONTRACT_RERANK_API_BASE
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: rerank

  # OPTIONAL document-OCR VLM. Requires a vLLM started with
  # --model PaddlePaddle/PaddleOCR-VL on a separate container/GPU from the
  # chat model. Uncomment on a box that actually runs it.
  # - model_name: gpu/ocr/paddleocr-vl
  #   litellm_params:
  #     model: openai/PaddlePaddle/PaddleOCR-VL
  #     api_base: os.environ/CONTRACT_OCR_API_BASE
  #     api_key: "EMPTY"
  #     timeout: 300

  # OPTIONAL speech-to-text (POST /v1/audio/transcriptions), backed by the
  # `stt` service. Env-driven name like CONTRACT_VISION_ALIAS, but defaulting
  # the other way: compose names it unserved/stt, and deploy.sh publishes it as
  # gpu/stt/whisper only when ENABLE_STT=true, so a box that does not run the
  # backend never lists a dead role.
  - model_name: os.environ/CONTRACT_STT_ALIAS
    litellm_params:
      model: os.environ/CONTRACT_STT_MODEL
      api_base: os.environ/CONTRACT_STT_API_BASE
      api_key: "EMPTY"
      timeout: 60
    model_info:
      mode: audio_transcription

  # ==========================================================================
  # INTERNAL TOPOLOGY BELOW — not part of any consumer contract
  # ==========================================================================
  # THIRTEEN LEGACY ALIASES, EVERY ONE SWITCHABLE. Read the CONTRACT_VISION_ALIAS
  # comment above first: it argues that an alias which is published but does not
  # answer is strictly WORSE than an absent one, because a consumer routes
  # AROUND a missing name and breaks on a dead one. That argument applies here
  # too, and until 2026-09-12 this block ignored it — all thirteen names were
  # literals, so a box could not turn off the ones it had no backend for.
  #
  # Audited on ddai4 that day: of the nineteen aliases the box published,
  # THIRTEEN returned HTTP 500 or 404. The five `qwen3.6-*` entries asked for a
  # served model named `qwen3.6` while the engine serves `qwen3.6-35b-a3b`; the
  # six Ollama entries pointed at an Ollama that `ENABLE_OLLAMA=false` never
  # starts; the two `*-native` entries pointed at a TEI pair that exists only on
  # server-85.
  #
  # DELETING THEM WOULD BE WRONG. They are load-bearing on server-85, whose
  # profile pins VLLM_PORT, VLLM_ROUTER_PORT, OLLAMA_PORT and VLLM_MODEL_NAME
  # specifically to keep them resolving — "260 of the last 290 gateway requests
  # were openai/qwen3.6". So they get the same treatment the optional contract
  # roles already have: an env-driven name with a historical default, which a
  # box that cannot serve one moves to the `unserved/` namespace.
  #
  # Defaults are the historical names, so server-85 is unchanged by this.
  # scripts/tests/test_published_aliases.sh is what keeps the next alias from
  # being added as a literal.
  #
  # The served MODEL name is env-driven for the same reason and is the other
  # half of the bug: `openai/qwen3.6` was correct on server-85 and wrong on
  # every Blackwell box. LEGACY_VLLM_MODEL defaults to openai/${VLLM_MODEL_NAME},
  # so each box asks its own engine for the name that engine actually serves.

  # ============================================================================
  # VLLM VIA THIS STACK'S OWN COMPOSE NETWORK
  # Served wherever ENABLE_VLLM is on — the engine is reached by service name,
  # so these need no host port and stay live on every box.
  # ============================================================================
  - model_name: os.environ/LEGACY_VLLM_ROUTER_ALIAS
    litellm_params:
      model: os.environ/LEGACY_VLLM_MODEL
      api_base: http://vllm-router-new:8080/v1
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      supports_parallel_function_calling: true
      supports_reasoning: true

  - model_name: os.environ/LEGACY_VLLM_DIRECT_ALIAS
    litellm_params:
      model: os.environ/LEGACY_VLLM_MODEL
      api_base: http://vllm-new:8000/v1
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      supports_parallel_function_calling: true
      supports_reasoning: true

  # Third name for the same compose-network engine as LEGACY_VLLM_DIRECT_ALIAS
  # above. Kept because consumers address it by name; it is not a second route.
  - model_name: os.environ/LEGACY_VLLM_DOCKER_ALIAS
    litellm_params:
      model: os.environ/LEGACY_VLLM_MODEL
      api_base: http://vllm-new:8000/v1
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      supports_parallel_function_calling: true
      supports_reasoning: true

  # ============================================================================
  # VLLM VIA HOST PORTS  (server-85: router :11500, direct :11502)
  # These reach the engine through host.docker.internal, so they are live only
  # on a box that publishes those host ports. Unserved elsewhere.
  # ============================================================================
  - model_name: os.environ/LEGACY_VLLM_ROUTER_HOST_ALIAS
    litellm_params:
      model: os.environ/LEGACY_VLLM_MODEL
      api_base: http://host.docker.internal:11500/v1
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      supports_parallel_function_calling: true

  - model_name: os.environ/LEGACY_VLLM_DIRECT_HOST_ALIAS
    litellm_params:
      model: os.environ/LEGACY_VLLM_MODEL
      api_base: http://host.docker.internal:11502/v1
      api_key: "EMPTY"
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      supports_parallel_function_calling: true

  # ============================================================================
  # DOCKERIZED OLLAMA  —  live only where ENABLE_OLLAMA=true
  # ============================================================================
  - model_name: os.environ/LEGACY_OLLAMA_QWEN25_7B_DOCKER_ALIAS
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://ollama:11434
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: os.environ/LEGACY_OLLAMA_GEMMA3_12B_DOCKER_ALIAS
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://ollama:11434
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  # ============================================================================
  # NATIVE OLLAMA  —  a host install, not this stack's container (server-85
  # pins OLLAMA_PORT=11437 to keep these four resolving)
  # ============================================================================
  - model_name: os.environ/LEGACY_OLLAMA_QWEN25_7B_NATIVE_ALIAS
    litellm_params:
      model: ollama/qwen2.5:7b
      api_base: http://host.docker.internal:11437
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: os.environ/LEGACY_OLLAMA_QWEN36_NATIVE_ALIAS
    litellm_params:
      model: ollama/qwen3.6:latest
      api_base: http://host.docker.internal:11437
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: os.environ/LEGACY_OLLAMA_GEMMA3_12B_NATIVE_ALIAS
    litellm_params:
      model: ollama/gemma3:12b
      api_base: http://host.docker.internal:11437
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: os.environ/LEGACY_OLLAMA_GRANITE33_8B_NATIVE_ALIAS
    litellm_params:
      model: ollama/granite3.3:8b
      api_base: http://host.docker.internal:11437
      timeout: 600
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  # ============================================================================
  # NATIVE TEI EMBED + RERANK  —  cruxint's workers on server-85 (:8081/:8082).
  # NOT this stack's Infinity; the contract's embed/rerank roles are separate.
  # ============================================================================
  - model_name: os.environ/LEGACY_EMBED_NATIVE_ALIAS
    litellm_params:
      model: openai/BAAI/bge-m3
      api_base: http://host.docker.internal:8081/v1
      api_key: "EMPTY"
    model_info:
      mode: embedding
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: os.environ/LEGACY_RERANK_NATIVE_ALIAS
    litellm_params:
      model: huggingface/BAAI/bge-reranker-v2-m3
      api_base: http://host.docker.internal:8082
    model_info:
      mode: rerank
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

# ============================================================================
# LITELLM SETTINGS
# ============================================================================
litellm_settings:
  # Per-role vLLM priority, so bulk work never queues interactive chat — see
  # role_priority.py and VLLM_SCHEDULING_POLICY in docker-compose.yml.
  callbacks: ["role_priority.role_priority"]
  # ── Response cache: OFF ────────────────────────────────────────────────
  # Was `cache: true` with a 600s Redis TTL. Turned off when this stack became
  # shared infrastructure behind consumer gateways:
  #   1. A response cache on a SHARED inference gateway serves one consumer's
  #      answer to another. Two clients sending the same prompt are not
  #      necessarily asking the same question.
  #   2. It makes bulk extraction runs non-reproducible in a way that looks
  #      like model nondeterminism — a stale answer from a prior run is
  #      indistinguishable from a fresh one, for 10 minutes.
  # Caching belongs in the consumer's own gateway, where it knows the call's
  # semantics. Redis stays up: LiteLLM uses it for router state and rate
  # limiting, not only for response caching.
  cache: false
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 600

  # Drop provider-unsupported request params instead of 400ing. Consumers send
  # OpenAI-shaped params that individual backends reject (encoding_format on
  # embeddings, etc.); normalising here keeps a heterogeneous backend set
  # behind one API.
  drop_params: true

  request_timeout: 600
  # ── Retries: ZERO, by design ───────────────────────────────────────────
  # Retries must live in exactly ONE tier. A consumer gateway that retries
  # twice against a stack that retries twice turns one logical call into up to
  # nine upstream hits, and the consumer cannot tell a slow backend from a
  # retry storm it caused. The consumer's tier is the right one to own this:
  # it is the tier that can fail a call over to a different provider entirely,
  # which this stack cannot do.
  #
  # `allowed_fails` / `cooldown_time` in router_settings still apply — taking a
  # dead deployment out of rotation is health management, not retrying.
  num_retries: 0

  # Callbacks for observability
  success_callback: []
  failure_callback: []

  # Set moderations off
  content_policy_fallbacks: []

  # Default settings
  default_team_settings:
    - team_id: default
      max_parallel_requests: 100
      tpm_limit: 100000
      rpm_limit: 10000

# ============================================================================
# ROUTER SETTINGS
# ============================================================================
router_settings:
  # Routing strategy: simple-shuffle, least-busy, latency-based-routing
  routing_strategy: least-busy

  # No `fallbacks:` block, deliberately. Cross-provider fallback is the
  # consumer gateway's job — it holds the cloud credentials and the policy
  # about when spending money is preferable to failing. A GPU box silently
  # redirecting a call it cannot serve would bill an API the consumer thought
  # was unused.
  num_retries: 0

  # Enable model fallbacks
  enable_pre_call_checks: true

  # Allowed fails before removing model from rotation
  allowed_fails: 3

  # Cooldown period (seconds) before retrying failed model
  cooldown_time: 60

  # Timeout for model health checks
  model_group_timeout: 120

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
general_settings:
  # Master key for admin access (set via environment variable)
  # Database URL and master key are read from environment variables
  # DATABASE_URL and LITELLM_MASTER_KEY

  # Enable detailed debug logs
  # set_verbose: true

  # JSON logs for easier parsing
  json_logs: true

  # Store model info in database
  store_model_in_db: true

  # ── Load, per contract role ─────────────────────────────────────────────
  # GET /capacity            -> every role this box serves
  # GET /capacity/<alias>    -> one role, e.g. /capacity/gpu/chat/bulk
  # ?tokens=N                -> sized for requests of ~N tokens (prompt+output)
  #
  # Answered by the `capacity` service (scripts/capacity.py) from the engines'
  # own metrics. Proxied here so a consumer uses the same base URL and the same
  # virtual key it already sends completions with; auth: true means a request
  # without a valid key is refused by LiteLLM before it reaches the service.
  # Read `recommended_concurrency` as "how many more requests to put in flight
  # now", and re-read it every few seconds rather than once at startup.
  pass_through_endpoints:
    - path: "/capacity"
      target: "http://capacity:9097/capacity"
      auth: true
      include_subpath: true
