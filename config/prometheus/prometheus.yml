global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'gpu-inference-stack'
    server: '${SERVER_NAME:-gpu-server-1}'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
# rule_files:
#   - "rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # LiteLLM metrics - Disabled (LiteLLM doesn't expose Prometheus metrics endpoint)
  # LiteLLM provides metrics through its UI and database instead
  # - job_name: 'litellm'
  #   static_configs:
  #     - targets: ['litellm:4000']
  #       labels:
  #         service: 'litellm'
  #   metrics_path: '/metrics'
  #   scrape_interval: 30s

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
    scrape_interval: 30s

  # NVIDIA DCGM Exporter - GPU metrics
  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels:
          service: 'gpu'
    scrape_interval: 30s

  # Redis metrics via redis_exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    scrape_interval: 30s

  # Docker container metrics (if cadvisor is added)
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         service: 'docker'
  #   scrape_interval: 30s

  # vLLM metrics (if exposed)
  - job_name: 'vllm'
    static_configs:
      - targets: ['vllm-new:8000']
        labels:
          service: 'vllm'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Load per contract role, as consumers see it at /capacity (scripts/capacity.py).
  # gis_capacity_recommended_concurrency / _load / _state{role,backend}.
  - job_name: 'capacity'
    static_configs:
      - targets: ['capacity:9097']
        labels:
          service: 'capacity'
    metrics_path: '/metrics'
    scrape_interval: 15s

  # llama.cpp metrics.
  # Scraping works only because docker-compose.yml sets
  # LLAMA_ARG_ENDPOINT_METRICS=1 — llama-server's --metrics defaults to
  # DISABLED, so the endpoint 404s on a stock server.
  #
  # Left unconditional: llamacpp and vllm are mutually exclusive per box, so
  # exactly one of these two jobs has a live target at any time, and
  # Prometheus treats a down target as a scrape failure rather than a config
  # error. Keeping both jobs means the same prometheus.yml serves either
  # engine with no edit, matching how the rest of this stack is configured.
  - job_name: 'llamacpp'
    static_configs:
      - targets: ['llamacpp:8080']
        labels:
          service: 'llamacpp'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
