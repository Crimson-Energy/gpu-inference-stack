# Optional overlay. Separate GPU devices give compute isolation; sharing a
# device isolates queues only. Existing host placement is never rewritten.
services:
  infinity:
    command: v2 --model-id BAAI/bge-m3 --port 7997
  infinity-rerank:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:0.0.77}
    profiles: [infinity]
    restart: unless-stopped
    command: v2 --model-id BAAI/bge-reranker-v2-m3 --port 7998
    environment:
      HF_HOME: /app/.cache
      INFINITY_QUEUE_SIZE: ${INTERACTIVE_RERANK_QUEUE_SIZE:-16}
    volumes:
      - ${HF_HOME:-./data/huggingface}:/app/.cache
      - ./scripts/healthprobe.py:/healthprobe.py:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${RERANK_GPU_DEVICE:-0}']
              capabilities: [gpu]
    networks: [gpu-inference-net]
    healthcheck:
      test: [CMD, python3, /healthprobe.py, --url, 'http://localhost:7998/rerank', --kind, rerank, --model, BAAI/bge-reranker-v2-m3, --timeout, '10']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options: {max-size: 50m, max-file: '3'}
  litellm:
    environment:
      CONTRACT_RERANK_API_BASE: http://infinity-rerank:7998
