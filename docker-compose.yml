networks:
  gpu-inference-net:
    name: ${NETWORK_NAME:-gpu-inference-net}
    driver: bridge

volumes:
  ollama-data:
  prometheus-data:
  grafana-data:
  redis-data:
  stt-models:

# ── Shared vLLM instance definition ────────────────────────────────────────
# Anchored so the three chat instances below differ ONLY in name, port and
# environment. Keeping the command in one place is what stops instance 2 and 3
# quietly drifting from instance 1 — the flag-omission logic is subtle enough
# that three copies would not stay in step.
x-vllm-instance: &vllm-instance
  image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.23.0}
  restart: unless-stopped
  volumes:
    - ${VLLM_CACHE_DIR:-./data/vllm/cache}:/root/.cache
    - ${HF_HOME:-./data/huggingface}:/root/.cache/huggingface
    - ./scripts/healthprobe.py:/healthprobe.py:ro
  # SHELL FORM, deliberately. A YAML-list command cannot express "omit this
  # flag": a variable expanding to "" still produces an empty argv entry, and
  # vLLM rejects it. `${VAR:+…}` in the container's shell emits nothing at all
  # when VAR is empty, which is what lets one definition serve a dense model, a
  # non-thinking model, and a tool-less model.
  #
  # $$ escapes the $ so compose passes it through for the shell to expand. The
  # image entrypoint is ["vllm","serve"]; this replaces it with a shell and
  # execs the same CLI. Model is positional: --model is deprecated and warns.
  entrypoint: ["/bin/sh", "-lc"]
  command:
    - >-
      exec vllm serve "$${GIS_MODEL}"
      --served-model-name "$${GIS_MODEL_NAME}"
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization "$${GIS_GPU_UTIL}"
      --max-model-len "$${GIS_MAX_MODEL_LEN}"
      --max-num-seqs "$${GIS_MAX_NUM_SEQS}"
      $${GIS_KV_CACHE_DTYPE:+--kv-cache-dtype "$${GIS_KV_CACHE_DTYPE}"}
      --tensor-parallel-size "$${GIS_TP_SIZE}"
      $${GIS_STRUCTURED_OUTPUTS:+--structured-outputs-config "$${GIS_STRUCTURED_OUTPUTS}"}
      $${GIS_PREFIX_CACHING:+--enable-prefix-caching}
      $${GIS_CHUNKED_PREFILL:+--enable-chunked-prefill}
      $${GIS_EXPERT_PARALLEL:+--enable-expert-parallel}
      $${GIS_TOOL_PARSER:+--enable-auto-tool-choice --tool-call-parser "$${GIS_TOOL_PARSER}"}
      $${GIS_REASONING_PARSER:+--reasoning-parser "$${GIS_REASONING_PARSER}"}
      $${GIS_EXTRA_ARGS}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ['${GPU_DEVICES:-0}']
            capabilities: [gpu]
  networks:
    - gpu-inference-net
  healthcheck:
    # A short inference completion, not /health: vLLM's /health answers from the API
    # server process, so it reports fine while the engine core is wedged or
    # dead — the same blind spot that hid an 11-minute Infinity outage on
    # 2026-09-12 behind a green container.
    #
    # The probe reports readiness only. The host watchdog owns consecutive
    # failure streaks and restarts; Docker restart policy alone ignores health.
    test: ["CMD-SHELL", "python3 /healthprobe.py --url http://localhost:8000/v1/chat/completions --kind chat --model $${GIS_MODEL_NAME} --timeout ${HEALTHPROBE_TIMEOUT:-20} --threshold ${HEALTHPROBE_THRESHOLD:-5}"]
    interval: 30s
    timeout: 25s
    retries: 10
    start_period: 600s
  logging:
    driver: "json-file"
    options:
      max-size: "${MAX_LOG_SIZE:-100m}"
      max-file: "${MAX_LOG_FILES:-5}"

services:
  # ============================================================================
  # OLLAMA - Local LLM Server
  # ============================================================================
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.32.2@sha256:c3886c198155aa7d45a29851100cc16f5d6ea6777d635ddd0597fe95874161af}
    container_name: ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ${OLLAMA_MODELS_DIR:-./data/ollama/models}:/models
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION:-1}
      - OLLAMA_KEEP_ALIVE=24h
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # VLLM - High-performance LLM Inference
  # Enhanced to match/replace existing vllm-qwen36 container with all features
  # ============================================================================
  # ── vLLM chat instances ─────────────────────────────────────────────────
  # THREE instances, one per chat role at most. A profile enables only the ones
  # its card can actually hold: a 32 GB box runs `vllm` alone and delegates the
  # other roles to a peer, while a 97 GB box can run two or three.
  #
  # VRAM IS THE PROFILE'S RESPONSIBILITY. Nothing here stops you enabling three
  # instances whose gpu-memory-utilization sums past 1.0; vLLM preallocates, so
  # the second or third simply fails to start. Each instance's utilization is a
  # fraction of the WHOLE card, not of what is left.
  #
  # Each instance maps its own VLLM<N>_* variables onto the SAME internal names
  # the shared command reads, which is what lets one command definition serve
  # all three. Consequence worth knowing: inside the container the variable is
  # always VLLM_MODEL, whichever instance it is.
  vllm:
    <<: *vllm-instance
    container_name: vllm-new
    profiles: [vllm]
    # Raw engines default to loopback; gateway traffic uses the Docker network.
    # Legacy direct consumers must opt in with an explicit *_BIND_ADDR.
    ports:
      - "${VLLM_BIND_ADDR:-127.0.0.1}:${VLLM_PORT:-8100}:8000"
    environment: &vllm-1-env
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # Read by vLLM itself, so it keeps its own VLLM_ name rather than the
      # GIS_ rename below. Default "0", NEVER empty: vLLM parses it as
      # bool(int(os.getenv(...,"0"))) and int("") raises, so a `-` default
      # would crash the engine at import on every box that leaves it unset.
      - VLLM_HAS_FLASHINFER_CUBIN=${VLLM_HAS_FLASHINFER_CUBIN:-0}
      # Container-internal names are GIS_*, not VLLM_*, on purpose: vLLM scans
      # its own VLLM_ namespace at startup and logs "Unknown vLLM environment
      # variable" for every one of these, which buried real warnings in noise.
      # The names a profile sets are unchanged — only what reaches the
      # container is renamed.
      - GIS_MODEL=${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      - GIS_MODEL_NAME=${VLLM_MODEL_NAME:-qwen3.6}
      - GIS_GPU_UTIL=${VLLM_GPU_MEMORY_UTILIZATION:-0.65}
      - GIS_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-16384}
      - GIS_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-62}
      - GIS_KV_CACHE_DTYPE=${VLLM_KV_CACHE_DTYPE-}
      - GIS_TP_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - 'GIS_STRUCTURED_OUTPUTS=${VLLM_STRUCTURED_OUTPUTS_CONFIG-{"backend": "xgrammar", "disable_any_whitespace": true}}'
      - GIS_PREFIX_CACHING=${VLLM_PREFIX_CACHING-1}
      - GIS_CHUNKED_PREFILL=${VLLM_CHUNKED_PREFILL-1}
      - GIS_EXPERT_PARALLEL=${VLLM_EXPERT_PARALLEL-1}
      - GIS_TOOL_PARSER=${VLLM_TOOL_CALL_PARSER-qwen3_xml}
      - GIS_REASONING_PARSER=${VLLM_REASONING_PARSER-qwen3}
      - GIS_EXTRA_ARGS=${VLLM_EXTRA_ARGS-}

  # Second instance. Defaults inherit instance 1's model so a profile that
  # enables vllm2 without naming a model gets a working (if duplicated)
  # backend rather than a container that dies on an empty --model.
  vllm2:
    <<: *vllm-instance
    container_name: vllm2
    profiles: [vllm2]
    ports:
      - "${VLLM2_BIND_ADDR:-127.0.0.1}:${VLLM2_PORT:-8010}:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # Read by vLLM itself, so it keeps its own VLLM_ name rather than the
      # GIS_ rename below. Default "0", NEVER empty: vLLM parses it as
      # bool(int(os.getenv(...,"0"))) and int("") raises, so a `-` default
      # would crash the engine at import on every box that leaves it unset.
      - VLLM_HAS_FLASHINFER_CUBIN=${VLLM_HAS_FLASHINFER_CUBIN:-0}
      - GIS_MODEL=${VLLM2_MODEL:-${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}}
      - GIS_MODEL_NAME=${VLLM2_MODEL_NAME:-${VLLM_MODEL_NAME:-qwen3.6}-2}
      - GIS_GPU_UTIL=${VLLM2_GPU_MEMORY_UTILIZATION:-0.25}
      - GIS_MAX_MODEL_LEN=${VLLM2_MAX_MODEL_LEN:-${VLLM_MAX_MODEL_LEN:-16384}}
      - GIS_MAX_NUM_SEQS=${VLLM2_MAX_NUM_SEQS:-${VLLM_MAX_NUM_SEQS:-62}}
      - GIS_KV_CACHE_DTYPE=${VLLM2_KV_CACHE_DTYPE-${VLLM_KV_CACHE_DTYPE-}}
      - GIS_TP_SIZE=${VLLM2_TENSOR_PARALLEL_SIZE:-1}
      - 'GIS_STRUCTURED_OUTPUTS=${VLLM2_STRUCTURED_OUTPUTS_CONFIG-{"backend": "xgrammar", "disable_any_whitespace": true}}'
      - GIS_PREFIX_CACHING=${VLLM2_PREFIX_CACHING-1}
      - GIS_CHUNKED_PREFILL=${VLLM2_CHUNKED_PREFILL-1}
      - GIS_EXPERT_PARALLEL=${VLLM2_EXPERT_PARALLEL-1}
      - GIS_TOOL_PARSER=${VLLM2_TOOL_CALL_PARSER-qwen3_xml}
      - GIS_REASONING_PARSER=${VLLM2_REASONING_PARSER-qwen3}
      - GIS_EXTRA_ARGS=${VLLM2_EXTRA_ARGS-}

  vllm3:
    <<: *vllm-instance
    container_name: vllm3
    profiles: [vllm3]
    ports:
      - "${VLLM3_BIND_ADDR:-127.0.0.1}:${VLLM3_PORT:-8011}:8000"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_LOGGING_LEVEL=${VLLM_LOGGING_LEVEL:-INFO}
      # Read by vLLM itself, so it keeps its own VLLM_ name rather than the
      # GIS_ rename below. Default "0", NEVER empty: vLLM parses it as
      # bool(int(os.getenv(...,"0"))) and int("") raises, so a `-` default
      # would crash the engine at import on every box that leaves it unset.
      - VLLM_HAS_FLASHINFER_CUBIN=${VLLM_HAS_FLASHINFER_CUBIN:-0}
      - GIS_MODEL=${VLLM3_MODEL:-${VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}}
      - GIS_MODEL_NAME=${VLLM3_MODEL_NAME:-${VLLM_MODEL_NAME:-qwen3.6}-3}
      - GIS_GPU_UTIL=${VLLM3_GPU_MEMORY_UTILIZATION:-0.25}
      - GIS_MAX_MODEL_LEN=${VLLM3_MAX_MODEL_LEN:-${VLLM_MAX_MODEL_LEN:-16384}}
      - GIS_MAX_NUM_SEQS=${VLLM3_MAX_NUM_SEQS:-${VLLM_MAX_NUM_SEQS:-62}}
      - GIS_KV_CACHE_DTYPE=${VLLM3_KV_CACHE_DTYPE-${VLLM_KV_CACHE_DTYPE-}}
      - GIS_TP_SIZE=${VLLM3_TENSOR_PARALLEL_SIZE:-1}
      - 'GIS_STRUCTURED_OUTPUTS=${VLLM3_STRUCTURED_OUTPUTS_CONFIG-{"backend": "xgrammar", "disable_any_whitespace": true}}'
      - GIS_PREFIX_CACHING=${VLLM3_PREFIX_CACHING-1}
      - GIS_CHUNKED_PREFILL=${VLLM3_CHUNKED_PREFILL-1}
      - GIS_EXPERT_PARALLEL=${VLLM3_EXPERT_PARALLEL-1}
      - GIS_TOOL_PARSER=${VLLM3_TOOL_CALL_PARSER-qwen3_xml}
      - GIS_REASONING_PARSER=${VLLM3_REASONING_PARSER-qwen3}
      - GIS_EXTRA_ARGS=${VLLM3_EXTRA_ARGS-}

  vllm-router:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: vllm-router-new
    # NOT in the `vllm` profile any more. It used to start with every vLLM, so
    # a one-instance box ran an nginx that model-routes 1->1 — a pure extra hop
    # in front of the engine, plus a container. It is genuinely required only
    # where there is more than one instance to choose between, or where a
    # consumer addresses the engine THROUGH it (server-85's qwen3.6-vllm-router
    # alias reaches host :11500).
    #
    # scripts/deploy.sh adds this profile when ENABLE_VLLM_ROUTER is true — the
    # DEFAULT, so no existing box changes — and forces it on whenever a second
    # or third vLLM instance is enabled, since routing is not optional then.
    profiles:
      - vllm-router
    restart: unless-stopped
    ports:
      - "${VLLM_ROUTER_BIND_ADDR:-127.0.0.1}:${VLLM_ROUTER_PORT:-8001}:8080"
    volumes:
      # .template + the templates dir: the image's entrypoint runs envsubst
      # over these into /etc/nginx/, which is how ${ROUTER_HOST_*} become
      # real hostnames before nginx parses the file.
      - ./config/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./config/nginx/router.js:/etc/nginx/njs/router.js:ro
    environment:
      # njs builds its model map from these at request time, so the router
      # advertises and routes exactly what THIS box serves. Defaults mirror the
      # vllm services' own defaults; instances 2 and 3 stay empty unless the
      # profile names them, and an empty name is simply left out of the map.
      - ROUTER_MODEL_1=${VLLM_MODEL_NAME:-qwen3.6}
      - ROUTER_UPSTREAM_1=@vllm_1
      - ROUTER_MODEL_2=${VLLM2_MODEL_NAME-}
      - ROUTER_UPSTREAM_2=${VLLM2_MODEL_NAME:+@vllm_2}
      - ROUTER_MODEL_3=${VLLM3_MODEL_NAME-}
      - ROUTER_UPSTREAM_3=${VLLM3_MODEL_NAME:+@vllm_3}
      # Upstream hosts, substituted into nginx.conf by the image's
      # envsubst-on-templates entrypoint. Absent instances fall back to
      # instance 1 — inert, because njs only routes to names it has in its
      # map, and it keeps the resolver from failing on a host that does not
      # exist.
      # The image's entrypoint templates /etc/nginx/templates/*.template into
      # NGINX_ENVSUBST_OUTPUT_DIR, which defaults to conf.d/ — wrong for a
      # whole nginx.conf, so point it at /etc/nginx. envsubst is called with an
      # explicit list of DEFINED env vars, so nginx's own $host, $remote_addr
      # and friends survive untouched.
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
      - ROUTER_HOST_1=vllm-new:8000
      # Default to instance 1's host, NOT to empty: an empty value renders
      # `server ;` and nginx refuses to start with "invalid number of
      # arguments". The default is inert — njs only routes to names present in
      # its map, and an absent instance contributes none.
      #
      # A plain `:-` default, not `${A:+x}${A:-y}`: compose has no
      # if/else here, so that form CONCATENATES both branches when the
      # variable is set (it produced `vllm2:8000qwen3.6-bulk`). A profile
      # enabling instance 2 sets VLLM2_HOST alongside VLLM2_MODEL_NAME.
      - ROUTER_HOST_2=${VLLM2_HOST:-vllm-new:8000}
      - ROUTER_HOST_3=${VLLM3_HOST:-vllm-new:8000}
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      # wget, not curl: nginx:alpine ships busybox wget and NO curl, so the
      # old probe exited 127 on every run and the container sat permanently
      # unhealthy while serving fine. Same class of bug as litellm's.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # LLAMA.CPP - GGUF Chat Engine (the A6000's engine; see servers/server-40.env)
  # ============================================================================
  llamacpp:
    # Pinned by BUILD NUMBER, not :latest, and the number is not arbitrary.
    #   - b10884 is the newest PUBLISHED build (the registry has images for
    #     only 521 of the server-cuda-b* builds, so most numbers do not
    #     resolve — b10665 returns `manifest unknown`). It is also the build
    #     actually pulled and flag-verified on the A6000.
    #   - The Blackwell profile overrides this to b10644, because
    #     ggml-org/llama.cpp#28355 (OPEN, filed 2026-09-04) reports the 51B
    #     PLE n-gram table failing to load on builds newer than 10665,
    #     causing extremely slow prefill. b10644 is the newest published
    #     build at or below 10665; b10666 is skipped deliberately, being one
    #     past the last known-good number.
    # Qwen3-Next-80B-A3B is NOT affected by #28355 (its support landed at
    # b7186), which is why the default here is the newer build.
    #
    # Like VLLM_IMAGE above, the runtime is part of what a deployment picks:
    # a too-old CUDA build does not degrade, every request dies with "no
    # kernel image is available for execution on the device". Verify on the
    # box before deploying:
    #   docker run --rm --entrypoint sh <image> -c '/app/llama-server --version'
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b10884}
    container_name: llamacpp
    profiles:
      - llamacpp
    restart: unless-stopped
    ports:
      # LOOPBACK BY DEFAULT, and that is a security decision.
      #
      # llama-server has no authentication here and sets CORS to '*' — it says
      # so itself on every boot:
      #   CORS is set to allow all origins ('*') and no API key is set
      #   this can be a security risk (cross-origin attacks)
      #
      # Published on 0.0.0.0 it was reachable over both the LAN and Netbird
      # (verified: HTTP 200 on 192.168.3.40:8083 and 100.117.227.40:8083),
      # which hands anyone on those networks the model directly — bypassing
      # LiteLLM's virtual keys, per-consumer spend tracking, rate limits and
      # the gpu/<task>/<role> contract altogether.
      #
      # LiteLLM never needs this port: it reaches the server as
      # http://llamacpp:8080 on the compose network. The host publish exists
      # only for local debugging and for scripts/benchmark.sh --direct. So
      # bind it to loopback and let a box opt into wider exposure explicitly.
      # Same reasoning as LITELLM_BIND_ADDR, which this file already documents.
      - "${LLAMACPP_BIND_ADDR:-127.0.0.1}:${LLAMACPP_PORT:-8083}:8080"
    volumes:
      # Read-only: the server has no reason to write to the weights directory.
      - ${LLAMACPP_MODELS_DIR:-./data/llamacpp/models}:/models:ro
      # The probe script, mounted the same way vllm and infinity mount it.
      - ./scripts/healthprobe.py:/healthprobe.py:ro
    # NO `command:`, deliberately. llama-server exposes LLAMA_ARG_* env vars
    # for 138 flags, so every knob is an environment entry with a compose
    # default. That sidesteps the problem the VLLM_*_FLAG comments above
    # document at length: compose can neither branch on a boolean nor
    # word-split a string into argv, which forces ugly "the value IS the
    # flag" tricks. Here a box overrides one variable in .env instead.
    environment:
      # ── Model ────────────────────────────────────────────────────────────
      - LLAMA_ARG_MODEL=/models/${LLAMACPP_MODEL_FILE:?LLAMACPP_MODEL_FILE must name a .gguf under LLAMACPP_MODELS_DIR}
      # The LiteLLM target: CONTRACT_*_MODEL is openai/<this value>. Unlike
      # vLLM's --served-model-name, a mismatch here is benign — llama-server
      # serves a single model and ignores the request's `model` field.
      - LLAMA_ARG_ALIAS=${LLAMACPP_MODEL_NAME:-llamacpp}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      #
      # ── Context: EXPLICIT, and that is load-bearing ──────────────────────
      # --ctx-size is a POOL divided across --parallel slots. So -c 32768
      # with -np 4 serves 8k per slot while gpu/chat/interactive and
      # gpu/chat/bulk promise >=32k. Nothing cheap catches that: /v1/models
      # lists the alias, the container is healthy, and health-check.sh's
      # contract probe sends a SHORT prompt that succeeds at any context
      # size. Only real long prompts fail, in production.
      #
      # Worse, -fit defaults to ON and adjusts *unset* arguments to fit
      # device memory, with --fit-ctx (default 4096) as the floor it may
      # shrink context to. Setting CTX_SIZE explicitly immunises against
      # that, because fit only touches unset args. FIT_CTX is the second line
      # of defence if someone ever unsets CTX_SIZE.
      #
      # 131072 / 4 slots = 32768 per slot = the contract floor exactly.
      # scripts/health-check.sh asserts the LIVE per-slot value, because
      # neither of the two settings below can catch later config drift.
      - LLAMA_ARG_CTX_SIZE=${LLAMACPP_CTX_SIZE:-131072}
      - LLAMA_ARG_N_PARALLEL=${LLAMACPP_PARALLEL:-4}
      - LLAMA_ARG_FIT_CTX=${LLAMACPP_FIT_CTX:-131072}
      #
      # DO NOT add LLAMA_ARG_KV_UNIFIED_PER_SLOT here. It reads like a floor
      # and is actually a CAP — the server logs
      #   srv load_model: capping per-slot context (131072) to
      #   --kv-unified-per-slot (32768)
      # so setting it to the contract minimum can only ever REDUCE context,
      # never protect it. On a 1-slot/128k profile it silently cut per-slot
      # context 4x, destroying exactly the long-context capability that
      # deployment exists for — and an assertion checking ">= 32768" passes.
      # CTX_SIZE and N_PARALLEL already determine per-slot context exactly.
      # LLAMACPP_CTX_PER_SLOT survives only as health-check.sh's floor.
      #
      # ── Residency ────────────────────────────────────────────────────────
      # LAZY_MODE=off is MANDATORY on the A6000. Its default is `auto`, which
      # means "read the rows of tensors larger than 4 GiB from disk on demand
      # instead of keeping them resident (requires mmap)". That box has NO
      # NVMe — /dev/sda is a rotational SAS logical volume — so on-demand
      # tensor reads are seek-bound. With 251 GB of RAM, residency is free.
      # This is also a plausible mechanism for #28355's slow-prefill symptom.
      - LLAMA_ARG_LAZY_MODE=${LLAMACPP_LAZY_MODE:-off}
      - LLAMA_ARG_LOAD_MODE=${LLAMACPP_LOAD_MODE:-mmap}
      #
      # ── Fit: ON, deliberately ────────────────────────────────────────────
      # N_CPU_MOE and N_GPU_LAYERS are intentionally left UNSET so that
      # `fit on` measures free VRAM at boot and offloads only the experts
      # that do not fit. The service then adapts when Infinity's footprint
      # moves, whereas a hardcoded -ncmoe tuned once goes stale and fails
      # CLOSED (OOM) rather than degrading. Set either to pin startup.
      #
      # NOTE THE ODD SYNTAX BELOW, and do not "simplify" it to `=${VAR:-}`.
      # An empty LLAMA_ARG_* value is NOT treated as unset — llama-server
      # parses it and dies:
      #   error while handling environment variable
      #   "LLAMA_ARG_N_CPU_MOE": invalid value
      # and because `restart: unless-stopped` is set, that becomes a crash
      # loop rather than a visible one-shot failure. Verified against
      # b10884: every numeric and enum LLAMA_ARG_* rejects empty; only
      # MMPROJ and ALIAS tolerate it.
      #
      # `VAR${X:+=${X}}` renders as the BARE name `VAR` when X is empty,
      # which is compose's pass-through form — and since the name is not in
      # the host environment, the variable is omitted from the container
      # entirely. When X is set it renders as `VAR=value` as normal.
      - LLAMA_ARG_FIT=${LLAMACPP_FIT:-on}
      - LLAMA_ARG_FIT_TARGET=${LLAMACPP_FIT_TARGET:-2048}
      - LLAMA_ARG_N_CPU_MOE${LLAMACPP_NCMOE:+=${LLAMACPP_NCMOE}}
      - LLAMA_ARG_N_GPU_LAYERS${LLAMACPP_NGL:+=${LLAMACPP_NGL}}
      #
      # ── Attention / KV ───────────────────────────────────────────────────
      # f16 KV, not q8_0: PR #27742 reports -ctk/-ctv q8_0 assertion failures
      # on the qwen4exp arch. q8_0 is a measured optimisation, not a default.
      - LLAMA_ARG_FLASH_ATTN=${LLAMACPP_FLASH_ATTN:-on}
      - LLAMA_ARG_CACHE_TYPE_K=${LLAMACPP_CACHE_TYPE_K:-f16}
      - LLAMA_ARG_CACHE_TYPE_V=${LLAMACPP_CACHE_TYPE_V:-f16}
      #
      # ── Throughput ───────────────────────────────────────────────────────
      # THREADS matters only when fit decides to offload experts to CPU.
      # CACHE_REUSE is llama.cpp's analogue of vLLM's --enable-prefix-caching
      # and defaults to 0 (disabled) upstream.
      - LLAMA_ARG_THREADS=${LLAMACPP_THREADS:-16}
      - LLAMA_ARG_CACHE_REUSE=${LLAMACPP_CACHE_REUSE:-256}
      #
      # ── API surface the contract needs ───────────────────────────────────
      # JINJA gives tool calling (already default-on in b10884; explicit so a
      # future default flip cannot silently drop the contract's tool support).
      # REASONING=auto extracts thought tags into `reasoning_content` instead
      # of leaking <think> into content — the equivalent of vLLM's
      # --reasoning-parser qwen3. METRICS is off upstream by default and is
      # what config/prometheus/prometheus.yml scrapes.
      - LLAMA_ARG_JINJA=1
      - LLAMA_ARG_REASONING=${LLAMACPP_REASONING:-auto}
      - LLAMA_ARG_ENDPOINT_METRICS=1
      #
      # ── Per-model extras (both unset on the A6000) ───────────────────────
      # OVERRIDE_TENSOR places Flash-Next's 51B PLE table in host memory
      # rather than on the GPU or streamed from disk; MMPROJ adds its vision
      # tower. Qwen3-Next-80B-A3B needs neither, so both are omitted here
      # via the same pass-through form documented above — OVERRIDE_TENSOR in
      # particular rejects an empty value outright.
      - LLAMA_ARG_OVERRIDE_TENSOR${LLAMACPP_OVERRIDE_TENSOR:+=${LLAMACPP_OVERRIDE_TENSOR}}
      - LLAMA_ARG_MMPROJ${LLAMACPP_MMPROJ:+=${LLAMACPP_MMPROJ}}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${LLAMACPP_GPU_DEVICES:-${GPU_DEVICES:-0}}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      # Probes the INFERENCE path, not /health — the lesson infinity and the
      # vLLM anchor above already carry. llama-server answers /health from its
      # HTTP layer, so a wedged slot pool reports healthy. That blind spot is
      # worse here than anywhere else in this file: on the A6000 all three
      # REQUIRED gpu/chat/* roles sit behind this single container, so a green
      # liveness probe can mask a total contract outage.
      #
      # python3, not curl. The image ships both — checked, not assumed; it has
      # curl and python3 but NOT wget or nc. Re-verify on any image bump:
      #   docker run --rm --entrypoint sh <image> -c 'command -v curl wget python3'
      #
      # The probe only REPORTS. scripts/watchdog.sh on the HOST is the half
      # that restarts, because a default-action signal sent to PID 1 from
      # inside its own namespace is discarded — see the docstring in
      # scripts/healthprobe.py, which records that being tested against a real
      # hang and not working.
      test: ["CMD-SHELL", "python3 /healthprobe.py --url http://localhost:8080/v1/chat/completions --kind chat --model ${LLAMACPP_MODEL_NAME:-llamacpp} --timeout ${HEALTHPROBE_TIMEOUT:-20} --threshold ${HEALTHPROBE_THRESHOLD:-5}"]
      interval: 30s
      # Above the probe's own --timeout, so Docker never kills the probe before
      # it can record a failure; a killed probe leaves the counter unchanged.
      timeout: 25s
      retries: 10
      # 15 min, longer than vLLM's 10. Reading 33 GiB of weights off the
      # A6000 box's rotational SAS array takes minutes before warmup starts.
      start_period: ${LLAMACPP_START_PERIOD:-900s}
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"


  # ============================================================================
  # TEXT EMBEDDINGS - Embedding Generation Service
  # ============================================================================
  embeddings:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference@sha256:af92a3852c965393cbdd111865c3a72445d2b430c7daf84269ffdb5cf178f4eb}
    container_name: embeddings
    profiles:
      - embeddings
    restart: unless-stopped
    ports:
      - "${EMBEDDINGS_BIND_ADDR:-127.0.0.1}:${EMBEDDINGS_PORT:-8082}:80"
    volumes:
      - ${HF_HOME:-./data/huggingface}:/data
    environment:
      - MODEL_ID=${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      - MAX_BATCH_TOKENS=${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      - MAX_CONCURRENT_REQUESTS=${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    command: >
      --model-id ${EMBEDDINGS_MODEL:-BAAI/bge-m3}
      --port 80
      --max-batch-tokens ${EMBEDDINGS_MAX_BATCH_TOKENS:-16384}
      --max-concurrent-requests ${EMBEDDINGS_MAX_CONCURRENT_REQUESTS:-512}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # INFINITY  —  embeddings + reranking (the contract's embed/rerank roles)
  # ============================================================================
  # Serves BAAI/bge-m3 AND BAAI/bge-reranker-v2-m3 from ONE container, which is
  # what config/litellm/config.yaml expects (both aliases carry the
  # `infinity/` provider prefix and point at the same port).
  #
  # BOTH --model-id flags are mandatory. An embed-only Infinity returns 400 on
  # /rerank, and a failing reranker does not surface as an error — a consumer's
  # retrieval silently degrades to un-reranked order.
  #
  # Why this exists alongside `embeddings` (TEI): TEI publishes no Blackwell
  # (sm_120) build — ghcr has turing / 89 / hopper / latest and nothing else —
  # and crash-loops there with "Runtime compute cap 120 is not compatible with
  # compile time compute cap 80". Infinity's torch engine runs on sm_120, and
  # measured 346-3475 embeddings/sec at batch 32 on an RTX PRO 4500. The two
  # services are ALTERNATIVES: CONTRACT_EMBED_API_BASE decides which is used.
  infinity:
    image: ${INFINITY_IMAGE:-michaelf34/infinity:0.0.77}
    container_name: infinity
    profiles:
      - infinity
    restart: unless-stopped
    ports:
      - "${INFINITY_BIND_ADDR:-127.0.0.1}:${INFINITY_PORT:-7997}:7997"
    volumes:
      - ${HF_HOME:-./data/huggingface}:/app/.cache
      - ./scripts/healthprobe.py:/healthprobe.py:ro
    environment:
      - HF_HOME=/app/.cache
      - INFINITY_QUEUE_SIZE=${INFINITY_QUEUE_SIZE:-512}
    # QUOTED in .env and it must stay quoted: deploy.sh and health-check.sh
    # both `source` that file, and an unquoted multi-word value makes the shell
    # run its second word as a command.
    command: ${INFINITY_CMD:-v2 --model-id BAAI/bge-m3 --model-id BAAI/bge-reranker-v2-m3 --port 7997}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      # Probes the INFERENCE path, not /health. On 2026-09-12 this container
      # served no embeddings for ~11 minutes — every request timed out, via the
      # gateway and directly — while Docker reported it healthy the entire
      # time, because /health is answered by the HTTP layer and the HTTP layer
      # was fine. A liveness probe cannot see a wedged engine.
      #
      # healthprobe.py also RESETS it: `restart: unless-stopped` acts on process
      # exit, never on health status, so an unhealthy container is otherwise
      # just labelled and left. After --threshold consecutive failures the probe
      # kills PID 1 and the restart policy replaces the container. See the
      # script for why this is not an autoheal sidecar (no docker.sock).
      test: ["CMD-SHELL", "python3 /healthprobe.py --url http://localhost:7997/embeddings --kind embeddings --model BAAI/bge-m3 --timeout ${HEALTHPROBE_TIMEOUT:-20} --threshold ${HEALTHPROBE_THRESHOLD:-5}"]
      interval: 30s
      # Above the probe's own timeout, so Docker never kills the probe before
      # it can record a failure — a killed probe leaves the counter unchanged
      # and the engine never gets reset.
      timeout: 25s
      retries: 5
      # Two models load sequentially from cold; the second only starts after the
      # first has warmed up.
      start_period: 600s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # STT - speech-to-text for the optional gpu/stt/whisper role
  # ============================================================================
  # speaches (faster-whisper behind an OpenAI-compatible
  # /v1/audio/transcriptions). OFF by default: ENABLE_STT=true in deploy.sh
  # adds the profile AND publishes the alias (it is unserved/stt otherwise).
  #
  # Device is a per-box choice, measured on ddai3 2026-10-11 with a 9.6 s clip:
  #   cpu  int8, 24 threads      4.6 s   no VRAM (the .env.example default)
  #   cuda int8_float16          ~1 s    1.3 GB VRAM
  # Smaller models are NOT the faster fallback: small.en and distil-large-v3
  # mis-heard "MMSI four one nine…" as "for 19001234", and identifiers are what
  # a spoken maritime question carries.
  #
  # The image tag follows STT_DEVICE. The GPU is reserved either way: every box
  # running this stack has one, and the cpu image simply does not use it.
  # Spec: project-deepdarshak/.claude/specs/2026-10-11-voice-questions-for-the-advisor.md (REQ-STT-01)
  stt:
    image: ${STT_IMAGE:-ghcr.io/speaches-ai/speaches:0.8.3-${STT_DEVICE:-cpu}}
    container_name: stt
    profiles:
      - stt
    restart: unless-stopped
    ports:
      - "${STT_BIND_ADDR:-127.0.0.1}:${STT_PORT:-8098}:8000"
    volumes:
      # A named volume, not the shared HF_HOME: speaches runs as uid 1000 and
      # HF_HOME is root-owned (Infinity writes it), so every download failed
      # with EACCES. Docker seeds a new named volume with the image dir's
      # ubuntu ownership.
      - stt-models:/home/ubuntu/.cache/huggingface
      - ./scripts/healthprobe.py:/healthprobe.py:ro
      - ./scripts/stt-entrypoint.sh:/stt-entrypoint.sh:ro
    # speaches 0.8.3 has no preload: the entrypoint installs and warms STT_MODEL.
    entrypoint: ["/stt-entrypoint.sh"]
    environment:
      - STT_MODEL=${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
      - WHISPER__INFERENCE_DEVICE=${STT_DEVICE:-cpu}
      - WHISPER__COMPUTE_TYPE=${STT_COMPUTE_TYPE:-int8}
      - WHISPER__CPU_THREADS=${STT_CPU_THREADS:-24}
      # Never unload: speaches drops an idle model after 300 s by default, and
      # the reload costs 13 s on the next question.
      - WHISPER__TTL=-1
      - ENABLE_UI=false
      - LOG_LEVEL=info
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    networks:
      - gpu-inference-net
    healthcheck:
      # A real transcription of one second of silence (answers ""), not
      # /health: see healthprobe.py for why a liveness probe is not enough.
      test: ["CMD-SHELL", "python3 /healthprobe.py --url http://localhost:8000/v1/audio/transcriptions --kind transcription --model $${STT_MODEL} --timeout ${HEALTHPROBE_TIMEOUT:-20}"]
      interval: 30s
      timeout: 25s
      retries: 5
      # First start downloads ~1.6 GB of weights.
      start_period: 900s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # REDIS - Caching Layer for LiteLLM
  # ============================================================================
  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: redis
    restart: unless-stopped
    ports:
      # Loopback and off 6379 by default. 6379 is FalkorDB's port — it speaks
      # RESP too — and deepdarshak/ember publish their graph there on the boxes
      # this stack shares. Nothing needs this redis from the host: LiteLLM and
      # redis-exporter reach it as redis:6379 on gpu-inference-net, and it has
      # no password. On 2026-09-24 the 6379 clash (plus a preflight that
      # stopped the holder) took ddai4's knowledge graph down.
      - "${REDIS_BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6390}:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-2gb}
      --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
      --save 60 1000
      --appendonly yes
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # LITELLM - Unified LLM Gateway
  # ============================================================================
  litellm:
    # BUILT, not pulled. config/litellm/Dockerfile bakes Pillow into the
    # upstream image; without it every Ollama-backed gpu/chat/vision call fails
    # with "ollama image conversion failed / No module named 'PIL'" — and fails
    # INVISIBLY to a contract probe, because the alias is present in /v1/models
    # and Ollama is healthy, so a consumer's boot check passes and only real
    # requests 500.
    #
    # The build section was lost when docker-compose.yml was reverted over
    # newer work; the Dockerfile survived but nothing referenced it, so the
    # layer silently stopped being applied. Restored here.
    #
    # `pull_policy: build` keeps `compose up` from trying to fetch the local
    # tag from a registry. The base digest is fixed unless explicitly overridden.
    image: gpu-inference-stack-litellm:latest
    pull_policy: build
    build:
      context: ./config/litellm
      dockerfile: Dockerfile
      args:
        LITELLM_BASE_IMAGE: ${LITELLM_BASE_IMAGE:-ghcr.io/berriai/litellm@sha256:1a9625b107f09f80f312ffaa3c7f7f3c0b2bf59a49ed0d5b8c3e90edcc30bb90}
    # REQUIRED, not optional. On Linux `host.docker.internal` does not exist
    # inside a container unless it is mapped — only Docker Desktop provides it
    # for free — and EIGHT of the thirteen legacy aliases in
    # config/litellm/config.yaml reach host-native services through that name:
    # qwen3.6-vllm-direct (:11502), qwen3.6-vllm-router (:11500), the four
    # *-ollama-native (:11437), bge-m3-native (:8081) and
    # bge-reranker-v2-m3-native (:8082).
    #
    # Without it those aliases are PUBLISHED AND BROKEN: /v1/models lists them,
    # the container is healthy, and every request fails DNS resolution. It was
    # previously supplied by a per-host docker-compose.override.yml, which is
    # exactly the kind of thing that disappears when a box is rebuilt from the
    # repo — so it belongs here, where every deployment gets it.
    #
    # Harmless on a box that reaches nothing on the host: the name simply
    # resolves to the gateway and goes unused.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: litellm
    restart: unless-stopped
    ports:
      # Pin LITELLM_BIND_ADDR to the Netbird/LAN interface on a box whose
      # consumers live elsewhere; leave 0.0.0.0 for a single-host install.
      - "${LITELLM_BIND_ADDR:-0.0.0.0}:${LITELLM_PORT:-8080}:4000"
    volumes:
      - ./config/litellm:/app/config
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set a non-placeholder LITELLM_MASTER_KEY}
      # UI credentials — set via `make set-passwd`, stored encrypted in .env.secrets
      - UI_USERNAME=${UI_USERNAME:-admin}
      - UI_PASSWORD=${UI_PASSWORD:-}
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - STORE_MODEL_IN_DB=True
      - LITELLM_DROP_PARAMS=${LITELLM_DROP_PARAMS:-true}
      - REQUEST_TIMEOUT=${LITELLM_REQUEST_TIMEOUT:-600}
      - REDIS_HOST=${LITELLM_REDIS_HOST:-redis}
      - REDIS_PORT=${LITELLM_REDIS_PORT:-6379}
      # ── EMBER CONTRACT — which model on this box fills each gpu/<task>/<role>
      # config/litellm/config.yaml reads all twelve of these as
      # `os.environ/CONTRACT_*`. They MUST be forwarded here: without them
      # LiteLLM still publishes all six contract aliases in /v1/models and every
      # request to them fails, which from a consumer's side is
      # indistinguishable from a healthy stack with a broken model.
      #
      # scripts/deploy.sh's role guard cannot catch that — it verifies the
      # variables are set in the shell, and has no way to know the container
      # never received them. scripts/check-contract-wiring.sh is what closes
      # that gap; it diffs the os.environ/ names in config.yaml against the
      # names actually passed here, and deploy.sh runs it first.
      #
      # Defaults describe THIS box's local topology, so a profile that sets only
      # VLLM_MODEL / VLLM_MODEL_NAME gets a working contract with no further
      # edits. A box serving a role from another machine, or from a second
      # engine, overrides just that role's pair.
      # Each role carries an API KEY as well as a base. EMPTY is right for a
      # local engine; a role delegated to a PEER stack must carry that peer's
      # key or the peer's LiteLLM 401s. Profiles set these from the shared
      # GPU_<octet>_KEY block, e.g. CONTRACT_BULK_API_KEY=${GPU_40_KEY}.
      - CONTRACT_INTERACTIVE_MODEL=${CONTRACT_INTERACTIVE_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_INTERACTIVE_API_BASE=${CONTRACT_INTERACTIVE_API_BASE:-http://vllm:8000/v1}
      - CONTRACT_INTERACTIVE_API_KEY=${CONTRACT_INTERACTIVE_API_KEY:-EMPTY}
      - CONTRACT_BULK_MODEL=${CONTRACT_BULK_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_BULK_API_BASE=${CONTRACT_BULK_API_BASE:-http://vllm:8000/v1}
      - CONTRACT_BULK_API_KEY=${CONTRACT_BULK_API_KEY:-EMPTY}
      - CONTRACT_FAST_MODEL=${CONTRACT_FAST_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - CONTRACT_FAST_API_BASE=${CONTRACT_FAST_API_BASE:-http://vllm:8000/v1}
      - CONTRACT_FAST_API_KEY=${CONTRACT_FAST_API_KEY:-EMPTY}
      # A box that cannot serve vision sets CONTRACT_VISION_ALIAS to a name
      # outside the gpu/ namespace (conventionally unserved/vision): consumers
      # looking for gpu/chat/vision do not find it and fall back cleanly, while
      # the deployment stays introspectable. Defaults to the contract name so
      # every box that CAN serve vision is unaffected.
      - CONTRACT_VISION_ALIAS=${CONTRACT_VISION_ALIAS:-gpu/chat/vision}
      - CONTRACT_VISION_MODEL=${CONTRACT_VISION_MODEL:-ollama/${OLLAMA_VISION_MODEL:-gemma3:12b}}
      - CONTRACT_VISION_API_BASE=${CONTRACT_VISION_API_BASE:-http://ollama:11434}
      - CONTRACT_VISION_API_KEY=${CONTRACT_VISION_API_KEY:-EMPTY}
      # Infinity serves bge-m3 AND bge-reranker-v2-m3 from one container, which
      # is why both point at the same port. On a card where TEI works, point
      # these at the `embeddings` service instead.
      - CONTRACT_EMBED_ALIAS=${CONTRACT_EMBED_ALIAS:-gpu/embed/bge-m3}
      - CONTRACT_RERANK_ALIAS=${CONTRACT_RERANK_ALIAS:-gpu/rerank/bge-reranker-v2-m3}
      - CONTRACT_EMBED_API_BASE=${CONTRACT_EMBED_API_BASE:-http://infinity:7997}
      - CONTRACT_RERANK_API_BASE=${CONTRACT_RERANK_API_BASE:-http://infinity:7997}
      - CONTRACT_OCR_API_BASE=${CONTRACT_OCR_API_BASE:-http://vllm:8000/v1}
      # Optional and OFF by default, so the alias defaults to the unserved
      # namespace; deploy.sh sets gpu/stt/whisper when ENABLE_STT=true.
      - CONTRACT_STT_ALIAS=${CONTRACT_STT_ALIAS:-unserved/stt}
      - CONTRACT_STT_MODEL=${CONTRACT_STT_MODEL:-openai/${STT_MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}}
      - CONTRACT_STT_API_BASE=${CONTRACT_STT_API_BASE:-http://stt:8000/v1}
      # ── LEGACY ALIASES — the thirteen names outside the gpu/ contract ──────
      # Every one is env-driven so a box can turn off the ones it has no
      # backend for. Until 2026-09-12 they were literals in config.yaml, and
      # ddai4 published thirteen aliases that all returned HTTP 500/404 —
      # exactly the published-but-dead state the contract block argues against.
      #
      # The defaults below are the HISTORICAL names, so a box that sets none of
      # these (server-85, where these aliases carry real traffic) is unchanged.
      # A box that cannot serve one sets it to `unserved/<something>` in its
      # server profile, which publishes the deployment outside the consumable
      # namespace — introspectable for debugging, invisible to a consumer.
      #
      # LEGACY_VLLM_MODEL is the other half of the fix: the five qwen3.6-*
      # entries hardcoded `openai/qwen3.6`, which is what server-85's engine
      # serves and NOT what any Blackwell box serves. Deriving it from
      # VLLM_MODEL_NAME means each box asks its own engine for the name that
      # engine actually answers to.
      - LEGACY_VLLM_MODEL=${LEGACY_VLLM_MODEL:-openai/${VLLM_MODEL_NAME:-qwen3.6}}
      - LEGACY_VLLM_ROUTER_ALIAS=${LEGACY_VLLM_ROUTER_ALIAS:-qwen3.6-new-router}
      - LEGACY_VLLM_DIRECT_ALIAS=${LEGACY_VLLM_DIRECT_ALIAS:-qwen3.6-new-direct}
      - LEGACY_VLLM_DOCKER_ALIAS=${LEGACY_VLLM_DOCKER_ALIAS:-qwen3.6-vllm-docker}
      - LEGACY_VLLM_ROUTER_HOST_ALIAS=${LEGACY_VLLM_ROUTER_HOST_ALIAS:-qwen3.6-vllm-router}
      - LEGACY_VLLM_DIRECT_HOST_ALIAS=${LEGACY_VLLM_DIRECT_HOST_ALIAS:-qwen3.6-vllm-direct}
      - LEGACY_OLLAMA_QWEN25_7B_DOCKER_ALIAS=${LEGACY_OLLAMA_QWEN25_7B_DOCKER_ALIAS:-qwen2.5-7b-ollama-docker}
      - LEGACY_OLLAMA_GEMMA3_12B_DOCKER_ALIAS=${LEGACY_OLLAMA_GEMMA3_12B_DOCKER_ALIAS:-gemma3-12b-ollama-docker}
      - LEGACY_OLLAMA_QWEN25_7B_NATIVE_ALIAS=${LEGACY_OLLAMA_QWEN25_7B_NATIVE_ALIAS:-qwen2.5-7b-ollama-native}
      - LEGACY_OLLAMA_QWEN36_NATIVE_ALIAS=${LEGACY_OLLAMA_QWEN36_NATIVE_ALIAS:-qwen3.6-ollama-native}
      - LEGACY_OLLAMA_GEMMA3_12B_NATIVE_ALIAS=${LEGACY_OLLAMA_GEMMA3_12B_NATIVE_ALIAS:-gemma3-12b-ollama-native}
      - LEGACY_OLLAMA_GRANITE33_8B_NATIVE_ALIAS=${LEGACY_OLLAMA_GRANITE33_8B_NATIVE_ALIAS:-granite3.3-8b-ollama-native}
      - LEGACY_EMBED_NATIVE_ALIAS=${LEGACY_EMBED_NATIVE_ALIAS:-bge-m3-native}
      - LEGACY_RERANK_NATIVE_ALIAS=${LEGACY_RERANK_NATIVE_ALIAS:-bge-reranker-v2-m3-native}
    # NO --detailed_debug by default. Measured on ddai3 2026-09-12: with it on,
    # embeddings through the gateway ran at 49/s against the engine's ~1000/s —
    # a 10x tax paid on EVERY request, because the flag logs the full request
    # and response, and an embedding response is batch x 1024 floats. It also
    # made the cost scale with batch size, so the bigger the batch a caller
    # sent to go faster, the more it lost. Removing it: 49 -> 507/s float,
    # 155 -> 1253/s base64, and chat overhead 65 -> 58ms.
    #
    # Set LITELLM_EXTRA_ARGS=--detailed_debug to get it back for a debugging
    # session; it is a debugging tool, not a deployment setting.
    command: --config /app/config/config.yaml --port 4000 ${LITELLM_EXTRA_ARGS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "${MAX_LOG_SIZE:-100m}"
        max-file: "${MAX_LOG_FILES:-5}"

  # ============================================================================
  # POSTGRES - Database for LiteLLM
  # ============================================================================
  postgres:
    image: postgres@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # GRAFANA - Visualization and Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      - prometheus
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NGINX - Reverse Proxy (Optional)
  # ============================================================================
  nginx:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: nginx
    profiles:
      - nginx
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDR:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./config/nginx/ingress.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - litellm
    networks:
      - gpu-inference-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node-exporter:
    image: prom/node-exporter@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # NVIDIA DCGM EXPORTER - GPU Metrics
  # ============================================================================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
    container_name: dcgm-exporter
    restart: unless-stopped
    ports:
      - "${DCGM_EXPORTER_PORT:-9400}:9400"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${GPU_DEVICES:-0}']
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # REDIS EXPORTER - Redis Metrics
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    container_name: redis-exporter
    restart: unless-stopped
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    networks:
      - gpu-inference-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
